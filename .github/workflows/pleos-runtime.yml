name: Pleos emulator installation check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pleos-runtime.yml'
permissions:
  contents: read
jobs:
  pleos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
          log-accepted-android-sdk-licenses: false
      - name: Install build tools and build current APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          rm -f 'apk/김재윤_하루전기_release.apk'
          python3 scripts/build_local.py
      - name: Download official Pleos Connect 2.1 image
        run: |
          df -h
          curl --fail --location --retry 2 --max-time 1200 'https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp_car_emulator.zip' -o /tmp/pleos.zip
          echo 'b4f858d5bcc6c71506d7edfc872bcb9e5a11acaa  /tmp/pleos.zip' | sha1sum -c -
          unzip -q /tmp/pleos.zip -d /tmp/pleos-image
          rm /tmp/pleos.zip
          df -h
          find /tmp/pleos-image -name system.img -print
      - name: Configure and launch Pleos emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          import os, pathlib
          matches=list(pathlib.Path('/tmp/pleos-image').rglob('system.img'))
          if len(matches)!=1: raise SystemExit('Expected exactly one system.img; found '+str(matches))
          image_dir=matches[0].parent
          avd=pathlib.Path.home()/'.android/avd';avd.mkdir(parents=True,exist_ok=True)
          d=avd/'MyCabin_Pleos.avd';d.mkdir(exist_ok=True)
          (avd/'MyCabin_Pleos.ini').write_text('avd.ini.encoding=UTF-8\npath='+str(d)+'\ntarget=android-34\n')
          (d/'config.ini').write_text('AvdId=MyCabin_Pleos\nabi.type=x86_64\nimage.sysdir.1='+str(image_dir)+'/\nhw.cpu.arch=x86_64\nhw.cpu.ncore=4\nhw.ramSize=4096\nhw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=160\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\ndisk.dataPartition.size=4096M\n')
          PY
          adb start-server
          mkfifo /tmp/pleos-serial
          exec 8<>/tmp/pleos-serial
          nohup "$ANDROID_HOME/emulator/emulator" -avd MyCabin_Pleos -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim -shell < /tmp/pleos-serial > /tmp/pleos-emulator.log 2>&1 &
          for i in $(seq 1 72); do
            if [ -s "$HOME/.android/adbkey.pub" ] && [ $((i % 18)) -eq 1 ]; then
              printf 'echo PLEOS_CONSOLE_CHECK; id; mkdir -p /data/misc/adb; echo "%s" >> /data/misc/adb/adb_keys; chmod 640 /data/misc/adb/adb_keys; setprop ctl.restart adbd\n' "$(cat "$HOME/.android/adbkey.pub")" >&8
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$' && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              echo 'Pleos ADB and Android boot ready'; exit 0
            fi
            sleep 5
          done
          grep -E 'PLEOS_CONSOLE_CHECK|uid=|Permission denied|Error|ERROR' /tmp/pleos-emulator.log | tail -60 || true
          tail -100 /tmp/pleos-emulator.log
          exit 1
      - name: Verify launch and capture Pleos interaction evidence
        run: python3 scripts/smoke_pleos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pleos-emulator-check
          path: |
            pleos-evidence/
            /tmp/pleos-emulator.log
          if-no-files-found: warn
