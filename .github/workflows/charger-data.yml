name: Inspect public KEPCO charger dataset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/charger-data.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve public charger location CSV
        run: |
          curl -fL --retry 2 --max-time 90 'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000002889115&fileDetailSn=1&insertDataPrcus=N' -o charger-data
          curl -fL --max-time 60 'https://www.data.go.kr/data/15102458/fileData.do' -o portal-page || true
          wc -c portal-page || true
          grep -iE 'fileDownload|atchFileId|fileDetailSn|csv' portal-page | head -40 || true
          for url in 'https://overpass.private.coffee/api/status' 'https://overpass-api.de/api/status' 'https://maps.mail.ru/osm/tools/overpass/api/status'; do
            echo "Checking $url"
            curl -4 -sS -I --connect-timeout 5 --max-time 8 "$url" || true
          done
          file charger-data
          wc -c charger-data
          head -c 800 charger-data || true
      - uses: actions/upload-artifact@v4
        with:
          name: kepco-public-charger-data
          path: |
            charger-data
            portal-page
