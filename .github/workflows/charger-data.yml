name: Inspect public KEPCO charger dataset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/charger-data.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Request the official published dataset
        run: |
          curl -fsSL -c cookies --max-time 60 'https://www.data.go.kr/data/15102458/fileData.do' -o portal-page
          curl -fsSL -b cookies -e 'https://www.data.go.kr/data/15102458/fileData.do' -X POST 'https://www.data.go.kr/tcs/dss/selectFileDataDownload.do' --data-urlencode 'publicDataPk=15102458' --data-urlencode 'publicDataDetailPk=uddi:4547fddc-cbd3-4b78-8b92-c3be4c26e5ec' --data-urlencode 'atchFileId=' --data-urlencode 'fileDetailSn=1' --data-urlencode 'publicDataTyCode=PR0051' --data-urlencode 'url=/tcs/dss/selectFileDataDownload.do' -o response.json || true
          python3 - <<'PY'
          import json,pathlib,urllib.parse
          try:
            obj=json.loads(pathlib.Path('response.json').read_text())
            print('Dataset response status:',obj.get('status'), 'error:',obj.get('error'))
            if obj.get('status') and obj.get('atchFileId'):
              q=urllib.parse.urlencode({'atchFileId':obj['atchFileId'],'fileDetailSn':obj.get('fileDetailSn',1),'insertDataPrcus':'N'})
              pathlib.Path('download-url').write_text('https://www.data.go.kr/cmm/cmm/fileDownload.do?'+q)
          except Exception as e: print('Dataset lookup failed:',str(e))
          PY
          if [ -f download-url ]; then curl -fsSL -b cookies -e 'https://www.data.go.kr/data/15102458/fileData.do' --max-time 90 "$(cat download-url)" -o charger-data || true; fi
          test ! -f charger-data || { wc -c charger-data; file charger-data; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepco-public-charger-data
          path: |
            charger-data
            response.json
            download-url
